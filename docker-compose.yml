services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mintreels}
      MYSQL_USER: ${MYSQL_USER:-mintreels}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mintreels}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mintreels}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-mintreels}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    platform: linux/amd64
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER:-mintreels}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-mintreels}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /app/apps/api
    command: sh -c "cd /app && pnpm install && cd /app/apps/api && node --watch --import @swc-node/register/esm-register src/main.ts"
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
    environment:
      CI: "true"
      DATABASE_URL: ${DATABASE_URL:-mysql://mintreels:mintreels@mysql:3306/mintreels}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: "3000"
      AI_PROVIDER: ${AI_PROVIDER:-pyai}
      KNOWLEDGE_BASE_PROVIDER: ${KNOWLEDGE_BASE_PROVIDER:-pyai}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      QUEUE_PROVIDER: ${QUEUE_PROVIDER:-bullmq}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /app/apps/worker
    command: sh -c "cd /app && pnpm install && cd /app/apps/worker && node --watch src/worker.ts"
    volumes:
      - ./:/app
      - worker_node_modules:/app/node_modules
    environment:
      CI: "true"
      DATABASE_URL: ${DATABASE_URL:-mysql://mintreels:mintreels@mysql:3306/mintreels}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /app/apps/web
    command: sh -c "cd /app && pnpm install && pnpm --filter @mintreels/web exec vite --host 0.0.0.0 --port 5173"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    environment:
      CI: "true"
      VITE_API_TARGET: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
  api_node_modules:
  worker_node_modules:
  web_node_modules:
